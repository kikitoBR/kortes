# Kortes Desktop: builds the Windows installer and publishes it to the public
# kikitoBR/kortes-releases (this repo is private). Installed copies find it there
# and update themselves (electron-updater); kortes.com.br links to it.
#
# Release a version:
#   1. set "version" in desktop/package.json (e.g. 0.2.0) and commit
#   2. git tag v0.2.0 && git push kortes v0.2.0
name: Kortes Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Each folder pins its own pnpm ("packageManager"): frontend 10.x, desktop 11.x.
      - name: pnpm (corepack)
        run: corepack enable

      - uses: astral-sh/setup-uv@v6

      - name: The tag matches desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./desktop/package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "A tag diz $tag mas desktop/package.json diz $version" >&2
            exit 1
          fi

      # Before the 30-minute build: the token can write to the releases repo (and that
      # repo has a first commit to tag), so a wrong token fails in a minute.
      - name: Releases token works
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: kikitoBR/kortes-releases
        run: |
          set -o pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=RELEASES_TOKEN::O secret RELEASES_TOKEN não existe ou está vazio no repositório kikitoBR/kortes."
            exit 1
          fi
          if ! gh api "repos/$REPO/commits?per_page=1" >/dev/null 2>&1; then
            readme=$(echo 'Instaladores do Kortes para Windows. Baixe em https://kortes.com.br' | base64 -w0)
            if ! out=$(gh api -X PUT "repos/$REPO/contents/README.md" -f message="Kortes releases" -f content="$readme" 2>&1); then
              echo "::error title=RELEASES_TOKEN::O token não consegue escrever em $REPO (Repository access deve incluir kortes-releases e Contents deve estar em Read and write). GitHub disse: $(echo "$out" | paste -sd ' ' | cut -c1-300)"
              exit 1
            fi
          fi
          echo "token ok: escreve em $REPO"

      - name: Portable programs (Postgres, Redis, ffmpeg, Deno)
        working-directory: desktop
        run: set -o pipefail; node scripts/fetch-runtime.mjs 2>&1 | tee -a ../ci.log

      - name: Portable Python with the backend
        working-directory: desktop
        run: set -o pipefail; node scripts/build-python.mjs 2>&1 | tee -a ../ci.log

      - name: Frontend (desktop edition)
        working-directory: desktop
        run: set -o pipefail; node scripts/build-frontend.mjs 2>&1 | tee -a ../ci.log

      - name: Installer
        working-directory: desktop
        run: |
          set -o pipefail
          { pnpm install --frozen-lockfile && pnpm run dist; } 2>&1 | tee -a ../ci.log

      # Installers go to the PUBLIC kikitoBR/kortes-releases (this code repo is private):
      # installed copies update from there (electron-updater) and the site links to it.
      # RELEASES_TOKEN: a fine-grained token with Contents read/write on kortes-releases.
      # Uploaded with gh (electron-builder's own upload once left the 520 MB installer
      # out without failing). The updater reads latest.yml; the blockmap makes updates small.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop/dist
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: kikitoBR/kortes-releases
        run: |
          set -o pipefail
          version="${GITHUB_REF_NAME#v}"
          files=("KortesSetup-$version.exe" "KortesSetup-$version.exe.blockmap" "latest.yml")
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "Falta $f" >&2; exit 1; }; done
          {
            if gh release view "$GITHUB_REF_NAME" --repo "$REPO" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$REPO" --clobber
            else
              gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$REPO" --title "Kortes $version"                 --notes "Instalador do Kortes para Windows 10/11 (64 bits): baixe KortesSetup-$version.exe."
            fi
            # Every file must really be there.
            for f in "${files[@]}"; do
              gh release view "$GITHUB_REF_NAME" --repo "$REPO" --json assets --jq '.assets[].name' | grep -qx "$f"                 || { echo "Não subiu: $f" >&2; exit 1; }
            done
          } 2>&1 | tee -a ../../ci.log

      # Logs need a GitHub login; annotations are public, so a failure shows its cause there.
      - name: Show the end of the log
        if: failure()
        run: |
          tail -n 40 ci.log | tr -cd '[:print:]\n' | awk '{printf "%s%%0A", $0}' > tail.txt
          echo "::error title=Kortes Desktop build::$(cat tail.txt)"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: KortesSetup
          path: desktop/dist/*.exe
          retention-days: 7
