# Kortes Desktop: builds the Windows installer and publishes it to GitHub Releases.
# Installed copies find it there and update themselves (electron-updater).
#
# Release a version:
#   1. set "version" in desktop/package.json (e.g. 0.2.0) and commit
#   2. git tag v0.2.0 && git push kortes v0.2.0
name: Kortes Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Each folder pins its own pnpm ("packageManager"): frontend 10.x, desktop 11.x.
      - name: pnpm (corepack)
        run: corepack enable

      - uses: astral-sh/setup-uv@v6

      - name: The tag matches desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./desktop/package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "A tag diz $tag mas desktop/package.json diz $version" >&2
            exit 1
          fi

      - name: Portable programs (Postgres, Redis, ffmpeg, Deno)
        working-directory: desktop
        run: set -o pipefail; node scripts/fetch-runtime.mjs 2>&1 | tee -a ../ci.log

      - name: Portable Python with the backend
        working-directory: desktop
        run: set -o pipefail; node scripts/build-python.mjs 2>&1 | tee -a ../ci.log

      - name: Frontend (desktop edition)
        working-directory: desktop
        run: set -o pipefail; node scripts/build-frontend.mjs 2>&1 | tee -a ../ci.log

      - name: Installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          {
            pnpm install --frozen-lockfile
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              pnpm run release
            else
              pnpm run dist
            fi
          } 2>&1 | tee -a ../ci.log

      # Logs need a GitHub login; annotations are public, so a failure shows its cause there.
      - name: Show the end of the log
        if: failure()
        run: |
          tail -n 40 ci.log | tr -cd '[:print:]\n' | awk '{printf "%s%%0A", $0}' > tail.txt
          echo "::error title=Kortes Desktop build::$(cat tail.txt)"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: KortesSetup
          path: desktop/dist/*.exe
          retention-days: 7
